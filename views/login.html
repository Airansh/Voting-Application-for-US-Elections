<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in | US Elections Voting</title>
    <link rel="stylesheet" href="/public/static/styles.css">
</head>
<body>
<header class="topbar"><a href="/">US Elections Voting</a></header>
<main class="narrow">
    <section class="card">
        <h1>Log in</h1>
        <form id="loginForm">
            <label for="voterId">Voter ID</label>
            <input type="text" id="voterId" name="voterId" autocomplete="username" required>
            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required>
            <button type="submit">Log in</button>
        </form>
        <div id="message" class="message" role="alert"></div>
        <div class="links">
            <a href="/ForgotPassword">Forgot password?</a>
            <a href="/RequestAccount">Request an account</a>
        </div>
    </section>
</main>
<script src="/socket.io/socket.io.js"></script>
<script src="/public/static/common.js"></script>
<script src="/public/static/login.js"></script>
</body>
</html>
