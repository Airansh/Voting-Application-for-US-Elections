<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin panel | US Elections Voting</title>
    <link rel="stylesheet" href="/public/static/styles.css">
</head>
<body>
<header class="topbar">
    <a href="/Admin">US Elections Voting &mdash; Admin</a>
    <div class="actions"><button id="logoutButton">Log out</button></div>
</header>
<main>
    <div id="message" class="message" role="status"></div>

    <section class="card">
        <h2>Pending voter requests</h2>
        <div class="table-wrap">
            <table id="votersTable">
                <thead>
                    <tr><th>Email</th><th>First name</th><th>Last name</th><th>Address</th><th>City</th>
                        <th>Zip code</th><th>Age</th><th>ID number</th><th>Actions</th></tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </section>

    <section class="card">
        <h2>Search voters</h2>
        <form id="searchForm" class="row">
            <div>
                <label for="searchCriteria">Search by</label>
                <select id="searchCriteria">
                    <option value="name">Name</option>
                    <option value="zipcode">Zip code</option>
                    <option value="email">Email</option>
                </select>
            </div>
            <div>
                <label for="searchValue">Value</label>
                <input type="text" id="searchValue" name="searchValue" required>
            </div>
            <div><label>&nbsp;</label><button type="submit">Search</button></div>
        </form>
        <div class="table-wrap">
            <table id="searchTable">
                <thead>
                    <tr><th>Email</th><th>First name</th><th>Last name</th><th>Address</th><th>City</th>
                        <th>Zip code</th><th>Age</th><th>ID number</th><th>Status</th></tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </section>

    <section class="card">
        <h2>Elections</h2>
        <div class="table-wrap">
            <table id="electionsTable">
                <thead><tr><th>Title</th><th>Race</th><th>Start</th><th>End</th><th>Status</th><th></th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </section>

    <section class="card">
        <h2>Results</h2>
        <button type="button" id="refreshResults">Refresh results</button>
        <div id="results"></div>
    </section>

    <div class="grid">
        <form id="precinctForm" class="card">
            <h2>Create precinct</h2>
            <label for="zipCode">Zip code</label>
            <input type="text" id="zipCode" name="zipCode" inputmode="numeric" maxlength="5" required>
            <label for="lastFourDigits">Last 4 digits of ZIP+4</label>
            <input type="text" id="lastFourDigits" name="lastFourDigits" inputmode="numeric" maxlength="4" required>
            <label for="votingLocation">Voting location address</label>
            <input type="text" id="votingLocation" name="votingLocation" required>
            <label for="pollingManager">Polling manager</label>
            <input type="text" id="pollingManager" name="pollingManager" required>
            <label for="stateElectionContact">State election contact</label>
            <input type="text" id="stateElectionContact" name="stateElectionContact" required>
            <button type="submit">Create precinct</button>
        </form>

        <form id="raceForm" class="card">
            <h2>Create race</h2>
            <label for="raceTitle">Race title</label>
            <input type="text" id="raceTitle" name="raceTitle" required>
            <label for="precinctZipCode">Precinct zip code</label>
            <input type="text" id="precinctZipCode" name="precinctZipCode" inputmode="numeric" maxlength="5" required>
            <label>Candidates</label>
            <div id="candidatesContainer"></div>
            <button type="button" class="secondary" id="addCandidate">Add candidate</button>
            <button type="submit">Create race</button>
        </form>

        <form id="electionForm" class="card">
            <h2>Create election</h2>
            <label for="electionTitle">Election title</label>
            <input type="text" id="electionTitle" name="electionTitle" required>
            <label for="races">Race</label>
            <select id="races" name="races" required></select>
            <label for="startTime">Start time</label>
            <input type="datetime-local" id="startTime" name="startTime" required>
            <label for="endTime">End time</label>
            <input type="datetime-local" id="endTime" name="endTime" required>
            <button type="submit">Create election</button>
        </form>
    </div>
</main>
<script src="/socket.io/socket.io.js"></script>
<script src="/public/static/common.js"></script>
<script src="/public/static/admin.js"></script>
</body>
</html>
