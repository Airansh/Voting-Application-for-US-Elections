<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot password | US Elections Voting</title>
    <link rel="stylesheet" href="/public/static/styles.css">
</head>
<body>
<header class="topbar"><a href="/">US Elections Voting</a></header>
<main class="narrow">
    <section class="card">
        <h1>Forgot password</h1>
        <p class="muted">Enter your voter ID and the email address you registered with. We will email you a link to choose a new password.</p>
        <form id="forgotPasswordForm">
            <label for="ID">Voter ID</label>
            <input type="text" id="ID" name="ID" required>
            <label for="Email">Email</label>
            <input type="email" id="Email" name="Email" required>
            <button type="submit" id="submit">Send reset link</button>
        </form>
        <div id="message" class="message" role="alert"></div>
        <div class="links"><a href="/Login">Back to log in</a></div>
    </section>
</main>
<script src="/socket.io/socket.io.js"></script>
<script src="/public/static/common.js"></script>
<script src="/public/static/forgotpassword.js"></script>
</body>
</html>
