<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voter dashboard | US Elections Voting</title>
    <link rel="stylesheet" href="/public/static/styles.css">
</head>
<body>
<header class="topbar">
    <a href="/Voter">US Elections Voting</a>
    <div class="actions">
        <a class="button" id="changeDetailsButton" href="/ChangeDetails">Change details</a>
        <button id="logoutButton">Log out</button>
    </div>
</header>
<main>
    <section class="card">
        <h1 id="welcome">Voter dashboard</h1>
        <p id="profile" class="muted"></p>
        <div id="message" class="message" role="alert"></div>
    </section>
    <section class="card">
        <h2>Elections</h2>
        <div class="table-wrap">
            <table id="electionsTable">
                <thead>
                    <tr><th>Name</th><th>Race</th><th>Start</th><th>End</th><th>Status</th><th></th></tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </section>
    <section class="card" id="voteForm" hidden>
        <h2>Cast your ballot</h2>
        <p id="race"></p>
        <form id="ballot">
            <label for="candidateSelect">Candidate</label>
            <select id="candidateSelect" required></select>
            <button type="submit">Submit vote</button>
            <button type="button" class="secondary" id="cancelVote">Cancel</button>
        </form>
    </section>
    <section class="card">
        <h2>Your voting history</h2>
        <div class="table-wrap">
            <table id="votingHistory">
                <thead><tr><th>Race</th><th>Candidate</th><th>Party</th><th>Voted at</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </section>
</main>
<script src="/socket.io/socket.io.js"></script>
<script src="/public/static/common.js"></script>
<script src="/public/static/voter.js"></script>
</body>
</html>
