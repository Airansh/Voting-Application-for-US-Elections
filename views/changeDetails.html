<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change details | US Elections Voting</title>
    <link rel="stylesheet" href="/public/static/styles.css">
</head>
<body>
<header class="topbar">
    <a href="/Voter">US Elections Voting</a>
    <div class="actions">
        <a class="button" href="/Voter">Back to dashboard</a>
        <button id="logoutButton">Log out</button>
    </div>
</header>
<main class="narrow">
    <section class="card">
        <h1>Change your details</h1>
        <p class="muted">Moving changes the precinct, and therefore the races, you are eligible to vote in.</p>
        <form id="changeDetailsForm">
            <label for="address">Street address</label>
            <input type="text" id="address" name="address" required>
            <label for="city">City</label>
            <input type="text" id="city" name="city" required>
            <label for="zipcode">Zip code</label>
            <input type="text" id="zipcode" name="zipcode" inputmode="numeric" pattern="\d{5}" maxlength="5" required>
            <button type="submit">Save changes</button>
        </form>
        <div id="message" class="message" role="alert"></div>
    </section>
</main>
<script src="/socket.io/socket.io.js"></script>
<script src="/public/static/common.js"></script>
<script src="/public/static/changeDetails.js"></script>
</body>
</html>
