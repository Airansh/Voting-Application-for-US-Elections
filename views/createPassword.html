<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create password | US Elections Voting</title>
    <link rel="stylesheet" href="/public/static/styles.css">
</head>
<body>
<header class="topbar"><a href="/">US Elections Voting</a></header>
<main class="narrow">
    <section class="card">
        <h1>Create your password</h1>
        <p class="muted">Use at least 8 characters, including a letter and a number.</p>
        <form id="createPasswordForm">
            <label for="password">New password</label>
            <input type="password" id="password" name="password" autocomplete="new-password" minlength="8" required>
            <label for="confirmPassword">Confirm password</label>
            <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" minlength="8" required>
            <button type="submit">Save password</button>
        </form>
        <div id="message" class="message" role="alert"></div>
        <div class="links"><a href="/Login">Back to log in</a></div>
    </section>
</main>
<script src="/socket.io/socket.io.js"></script>
<script src="/public/static/common.js"></script>
<script src="/public/static/createPassword.js"></script>
</body>
</html>
