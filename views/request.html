<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request an account | US Elections Voting</title>
    <link rel="stylesheet" href="/public/static/styles.css">
</head>
<body>
<header class="topbar"><a href="/">US Elections Voting</a></header>
<main class="narrow">
    <section class="card">
        <h1>Request a voter account</h1>
        <p class="muted">An administrator will review your request. Once approved you will receive your voter ID by email.</p>
        <form id="request-form" novalidate>
            <div class="row">
                <div><label for="first-name-field">First name</label><input type="text" name="firstName" id="first-name-field" required></div>
                <div><label for="last-name-field">Last name</label><input type="text" name="lastName" id="last-name-field" required></div>
            </div>
            <label for="email-field">Email</label>
            <input type="email" name="email" id="email-field" autocomplete="email" required>
            <label for="age-field">Age</label>
            <input type="number" name="age" id="age-field" min="18" max="130" required>
            <label for="address-field">Street address</label>
            <input type="text" name="address" id="address-field" autocomplete="street-address" required>
            <div class="row">
                <div><label for="city-field">City</label><input type="text" name="city" id="city-field" required></div>
                <div><label for="zip-code-field">Zip code</label><input type="text" name="zipCode" id="zip-code-field" inputmode="numeric" pattern="\d{5}" maxlength="5" required></div>
            </div>
            <label for="id-field">Driver's license / state ID number</label>
            <input type="text" name="idNo" id="id-field" required>
            <button type="submit" id="request-form-submit">Submit request</button>
        </form>
        <div id="request-message" class="message" role="alert"></div>
        <div class="links"><a href="/Login">Already have an account? Log in</a></div>
    </section>
</main>
<script src="/socket.io/socket.io.js"></script>
<script src="/public/static/common.js"></script>
<script src="/public/static/request.js"></script>
</body>
</html>
